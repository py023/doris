name: Code Review Runner

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      runtime_canary:
        description: Test the staged Codex package without submitting a review.
        required: false
        type: boolean
        default: false
      pr_number:
        required: false
        type: string
      head_sha:
        required: false
        type: string
      base_sha:
        required: false
        type: string
      review_focus:
        required: false
        type: string
        default: ''
      manage_status:
        description: Update the code-review commit status from this run.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # This workflow ends after TeamCity accepts the event. Its result and
  # cancellation do not represent or control the queued review's execution.
  # Review execution is reported by TeamCity and the code-review commit status.
  forward:
    name: Forward event to TeamCity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
          path: controller
          sparse-checkout: regression-test/pipeline/code-review
      - name: Enqueue review event
        env:
          # FIXME: Configure these repository variables and the TeamCity token.
          TEAMCITY_URL: ${{ vars.TEAMCITY_URL }}
          TEAMCITY_BUILD_TYPE: ${{ vars.TEAMCITY_REVIEW_BUILD_TYPE }}
          TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
        run: |
          python3 controller/regression-test/pipeline/code-review/main.py forward \
            --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --request-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --origin-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --teamcity-url "$TEAMCITY_URL" --teamcity-build-type "$TEAMCITY_BUILD_TYPE"
