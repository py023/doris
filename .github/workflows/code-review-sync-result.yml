name: Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  # Transport only: a green Action confirms enqueueing, not status synchronization.
  # The Python worker on TeamCity filters the event and publishes code-review.
  forward:
    name: Forward event to TeamCity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
          path: controller
          sparse-checkout: regression-test/pipeline/code-review
      - name: Enqueue review event
        env:
          # FIXME: Configure these repository variables and the TeamCity token.
          TEAMCITY_URL: ${{ vars.TEAMCITY_URL }}
          TEAMCITY_BUILD_TYPE: ${{ vars.TEAMCITY_REVIEW_STATUS_BUILD_TYPE }}
          TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
        run: |
          python3 controller/regression-test/pipeline/code-review/main.py forward --mode sync \
            --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --request-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --teamcity-url "$TEAMCITY_URL" --teamcity-build-type "$TEAMCITY_BUILD_TYPE"
